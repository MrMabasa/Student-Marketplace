
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Sets the character encoding and mobile-friendly page width. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Sets the browser tab title. -->
  <title>The Student Marketplace</title>

  <!-- Provides a description for the hosted website. -->
  <meta name="description"
        content="The Student Marketplace student account verification service.">

  <!-- Styles the simple Firebase Hosting landing page. -->
  <style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #071B59;
        color: #FFFFFF;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    main {
        width: 90%;
        max-width: 520px;
        padding: 40px 24px;
        box-sizing: border-box;
    }

    h1 {
        color: #FFD600;
        font-size: 30px;
    }

    p {
        line-height: 1.7;
        font-size: 16px;
    }

    .status {
        margin-top: 24px;
        padding: 14px;
        border: 1px solid #FFD600;
        border-radius: 8px;
    }
  </style>
</head>

<body>
<!-- Displays the basic identity and purpose of the hosted website. -->
<main>
  <h1>The Student Marketplace</h1>

  <p>
    A student-focused marketplace for buying and selling
    academic and everyday essentials.
  </p>

  <div class="status">
    Firebase Hosting is configured successfully.
  </div>
</main>
</body>
</html>
